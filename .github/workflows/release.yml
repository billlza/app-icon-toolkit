name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONWARNINGS: error

jobs:
  release-plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      toolchain: ${{ steps.targets.outputs.toolchain }}
      universal_verify_matrix: ${{ steps.targets.outputs.universal_verify_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        name: Load validated release target contract
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "matrix=$(python3 scripts/release_targets.py matrix)"
            echo "toolchain=$(python3 scripts/release_targets.py toolchain)"
            echo "universal_verify_matrix=$(python3 scripts/release_targets.py universal-verify-matrix)"
          } >> "$GITHUB_OUTPUT"
          python3 scripts/release_targets.py verify-about --about about.toml

  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust quality components
        run: rustup component add clippy rustfmt
      - name: Verify release version
        run: python3 scripts/check-release-version.py "$GITHUB_REF_NAME"
      - name: Test release scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Verify release and license target inventory
        run: python3 scripts/release_targets.py verify-about --about about.toml
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check advisories, licenses, and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories licenses sources
      - name: Install cargo-about
        run: cargo install --locked --version 0.9.2 --features cli cargo-about
      - name: Verify generated third-party notices
        run: ./scripts/check-licenses.sh

  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check with minimum supported Rust
        run: cargo +1.88.0 check --locked --workspace --all-targets --all-features
      - name: Test Windows atomic publication primitive with minimum supported Rust
        if: runner.os == 'Windows'
        run: >-
          cargo +1.88.0 test --locked --package app-icon-windows-fs
          --all-targets --all-features
      - name: Test with minimum supported Rust
        run: cargo +1.88.0 test --locked --workspace --all-targets --all-features

  build-assets:
    needs: release-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release version
        shell: bash
        run: ${{ matrix.python }} scripts/check-release-version.py "$GITHUB_REF_NAME"
      - name: Install pinned release toolchain and targets
        shell: bash
        run: >-
          ${{ matrix.python }} scripts/install-release-toolchain.py
          --plugin-root . --target "${{ matrix.id }}"
      - name: Install musl native toolchain
        if: matrix.family == 'linux_musl'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Run native target tests
        if: matrix.test_target != ''
        shell: bash
        env:
          RELEASE_TOOLCHAIN: ${{ needs.release-plan.outputs.toolchain }}
        run: >-
          cargo +"$RELEASE_TOOLCHAIN" test --locked --workspace
          --all-targets --all-features --target "${{ matrix.test_target }}"
      - name: Install Linux native validators
        if: matrix.id == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils icoutils
          test -n "${ANDROID_SDK_ROOT:-}"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;37.0.0" "platforms;android-37.0"
      - name: Validate Linux, Android, and Windows ICO output formats
        if: matrix.id == 'x86_64-unknown-linux-gnu'
        env:
          ANDROID_BUILD_TOOLS_VERSION: 37.0.0
          ANDROID_PLATFORM: android-37.0
          RUSTUP_TOOLCHAIN: ${{ needs.release-plan.outputs.toolchain }}
        run: ./scripts/check-native.sh android linux windows
      - name: Validate macOS app icon set
        if: matrix.family == 'macos'
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.release-plan.outputs.toolchain }}
        run: ./scripts/check-native.sh macos
      - name: Build pinned release candidate
        shell: bash
        run: >-
          ${{ matrix.python }} scripts/build-release-binary.py
          --plugin-root . --target "${{ matrix.id }}"
      - name: Check release binary architecture and runtime dependencies
        shell: bash
        run: >-
          ${{ matrix.python }} scripts/check-release-binary.py
          --plugin-root . --target "${{ matrix.id }}"
          --binary "target/release-candidates/${{ matrix.id }}/${{ matrix.binary_name }}"
      - name: Validate Windows MSIX asset qualifiers and package manifest
        if: matrix.family == 'windows_msvc'
        shell: pwsh
        run: >-
          ./scripts/check-msix-assets.ps1
          -Target "${{ matrix.id }}"
          -Toolchain "${{ needs.release-plan.outputs.toolchain }}"
          -Binary "target/release-candidates/${{ matrix.id }}/${{ matrix.binary_name }}"
      - name: Record source timestamp
        id: source
        shell: bash
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare and smoke-test release archive
        env:
          PYTHON: ${{ matrix.python }}
        shell: bash
        run: >-
          ${{ matrix.python }} scripts/prepare-release-package.py
          --plugin-root .
          --binary "target/release-candidates/${{ matrix.id }}/${{ matrix.binary_name }}"
          --target "${{ matrix.id }}"
          --tag "$GITHUB_REF_NAME"
          --format "${{ matrix.archive_format }}"
          --output dist
          --source-date-epoch "${{ steps.source.outputs.epoch }}"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-icon-toolkit-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  verify-universal-intel:
    needs: [release-plan, build-assets]
    strategy:
      matrix: ${{ fromJSON(needs.release-plan.outputs.universal_verify_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact Universal2 archive from this run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "app-icon-toolkit-${{ matrix.id }}" \
            --dir release-assets
      - name: Verify and smoke-test the same archive on Intel macOS
        shell: bash
        run: |
          set -euo pipefail
          archive="release-assets/app-icon-toolkit-${GITHUB_REF_NAME}-${{ matrix.id }}.tar.gz"
          test -s "$archive"
          mkdir extracted
          tar -xzf "$archive" -C extracted
          python3 scripts/check-release-binary.py \
            --plugin-root . \
            --target "${{ matrix.id }}" \
            --binary extracted/app-icon-toolkit/bin/app-icon-toolkit-mcp
          python3 scripts/smoke-installed-plugin.py extracted/app-icon-toolkit

  publish:
    needs: [quality, policy, msrv, build-assets, verify-universal-intel]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release version
        run: python3 scripts/check-release-version.py "$GITHUB_REF_NAME"
      - name: Download exact release archive set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          while IFS= read -r artifact; do
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" \
              --dir release-assets
          done < <(python3 scripts/release_targets.py artifact-names)
          python3 scripts/release_targets.py verify-assets \
            --directory release-assets \
            --tag "$GITHUB_REF_NAME"
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum app-icon-toolkit-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --verify-tag
          --title "App Icon Toolkit $GITHUB_REF_NAME"
          --notes-file CHANGELOG.md
