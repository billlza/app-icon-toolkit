name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check advisories, licenses, and dependency sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          command-arguments: advisories licenses sources
      - name: Install cargo-about
        run: cargo install --locked --version 0.9.2 cargo-about
      - name: Verify generated third-party notices
        run: ./scripts/check-licenses.sh

  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check with minimum supported Rust
        run: cargo +1.88.0 check --locked --workspace --all-targets --all-features
      - name: Test with minimum supported Rust
        run: cargo +1.88.0 test --locked --workspace --all-targets --all-features

  build-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_format: tar.gz
            binary_suffix: ""
            python: python3
          - os: macos-26
            target: aarch64-apple-darwin
            archive_format: tar.gz
            binary_suffix: ""
            python: python3
          - os: macos-26-intel
            target: x86_64-apple-darwin
            archive_format: tar.gz
            binary_suffix: ""
            python: python3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_format: zip
            binary_suffix: .exe
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: ${{ matrix.python }} scripts/check-release-version.py "${{ github.ref_name }}"
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install Rust quality components
        run: rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Install Linux native validators
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils icoutils
          sdkmanager "build-tools;37.0.0" "platforms;android-37.0"
      - name: Validate Linux, Android, and Windows output formats
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          ANDROID_BUILD_TOOLS_VERSION: 37.0.0
          ANDROID_PLATFORM: android-37.0
        run: ./scripts/check-native.sh android linux windows
      - name: Validate macOS output format
        if: endsWith(matrix.target, 'apple-darwin')
        run: ./scripts/check-native.sh macos
      - name: Build release binary
        run: cargo build --release --locked --package app-icon-mcp --target ${{ matrix.target }}
      - name: Record source timestamp
        id: source
        shell: bash
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare and smoke-test release archive
        env:
          PYTHON: ${{ matrix.python }}
        run: >-
          ${{ matrix.python }} scripts/prepare-release-package.py
          --plugin-root .
          --binary target/${{ matrix.target }}/release/app-icon-toolkit-mcp${{ matrix.binary_suffix }}
          --target ${{ matrix.target }}
          --tag "${{ github.ref_name }}"
          --format ${{ matrix.archive_format }}
          --output dist
          --source-date-epoch ${{ steps.source.outputs.epoch }}
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: app-icon-toolkit-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [policy, msrv, build-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: python3 scripts/check-release-version.py "${{ github.ref_name }}"
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum app-icon-toolkit-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*
          --verify-tag
          --title "App Icon Toolkit ${{ github.ref_name }}"
          --notes-file CHANGELOG.md
