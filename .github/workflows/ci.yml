name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check advisories, licenses, and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories licenses sources

  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check with minimum supported Rust
        run: cargo +1.88.0 check --locked --workspace --all-targets --all-features
      - name: Test Windows atomic publication primitive with minimum supported Rust
        if: runner.os == 'Windows'
        run: >-
          cargo +1.88.0 test --locked --package app-icon-windows-fs
          --all-targets --all-features
      - name: Test with minimum supported Rust
        run: cargo +1.88.0 test --locked --workspace --all-targets --all-features

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Test release scripts on Unix
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Test release scripts on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test Windows atomic publication primitive
        if: runner.os == 'Windows'
        run: >-
          cargo test --locked --package app-icon-windows-fs
          --all-targets --all-features
      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Build release binary
        run: cargo build --release --locked --package app-icon-mcp
      - name: Verify fresh-checkout plugin build on Unix
        if: runner.os != 'Windows'
        run: ./scripts/build-local.sh
      - name: Smoke-test installed plugin on Unix
        if: runner.os != 'Windows'
        run: python3 ./scripts/smoke-installed-plugin.py .
      - name: Verify fresh-checkout plugin build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-local.ps1
      - name: Smoke-test installed plugin on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python ./scripts/smoke-installed-plugin.py .

  license-notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-about
        run: cargo install --locked --version 0.9.2 --features cli cargo-about
      - name: Verify generated third-party notices
        run: ./scripts/check-licenses.sh

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate macOS app icon set with actool
        run: ./scripts/check-native.sh macos

  native-linux-android-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install independent desktop and ICO validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils icoutils
      - name: Install pinned Android SDK components
        run: |
          test -n "${ANDROID_SDK_ROOT:-}"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;37.0.0" "platforms;android-37.0"
      - name: Validate Android, Linux, and Windows artifacts
        env:
          ANDROID_BUILD_TOOLS_VERSION: 37.0.0
          ANDROID_PLATFORM: android-37.0
        run: ./scripts/check-native.sh android linux windows
