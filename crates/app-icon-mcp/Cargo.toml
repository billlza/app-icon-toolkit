[package]
name = "app-icon-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local MCP server for planning and generating cross-platform application icon bundles"
publish = false

[[bin]]
name = "app-icon-toolkit-mcp"
path = "src/main.rs"

[dependencies]
app-icon-domain.workspace = true
app-icon-engine.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
image.workspace = true
rmcp = { workspace = true, features = ["client"] }
serde_json.workspace = true
tempfile = "3.0"
tokio = { workspace = true, features = ["process", "time"] }

[lints]
workspace = true
